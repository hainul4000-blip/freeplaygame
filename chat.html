<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freeplay - Live Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { obsidian: '#07080d', cyanGlow: '#00f3ff', goldVip: '#ffd700' } } } }
    </script>
    <style>
        body { background-color: #07080d; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; position: relative; }
        .gaming-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #07080d; overflow: hidden; }
        .grid-overlay { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px); background-size: 50px 50px; animation: gridMove 25s linear infinite; }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }
        .glass-panel { background: rgba(5, 42, 51, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(0, 243, 255, 0.3); }
        .nav-center { background: linear-gradient(135deg, #00f3ff, #0088ff); box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); animation: pulseNav 2s infinite; }
        @keyframes pulseNav { 0%, 100% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); } 50% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); } }
        
        .msg-bot { background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px 12px 12px 2px; animation: fadeIn 0.3s ease-in-out; }
        .msg-user { background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 12px 12px 2px 12px; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 10px; }

        .typing-dot { width: 6px; height: 6px; background: #00f3ff; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .chip { background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); transition: all 0.2s; }
        .chip:hover { background: rgba(0, 243, 255, 0.25); border-color: #00f3ff; }
    </style>
</head>
<body>
    <div class="gaming-bg"><div class="grid-overlay"></div></div>

    <header class="fixed top-0 w-full z-50 glass-panel !border-t-0 !border-x-0 !rounded-none px-4 py-3 flex justify-between items-center bg-obsidian/90">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-obsidian border-2 border-cyanGlow flex items-center justify-center text-cyanGlow font-bold shadow-[0_0_10px_rgba(0,243,255,0.5)]">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-obsidian rounded-full"></div>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white">VIP Support Assistant</h1>
                <p class="text-[10px] text-green-400 font-medium">● Online</p>
            </div>
        </div>
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyanGlow to-goldVip p-0.5 shadow-[0_0_12px_rgba(0,243,255,0.4)] flex items-center justify-center">
                <div class="w-full h-full bg-obsidian rounded-[10px] flex items-center justify-center">
                    <i class="fas fa-gamepad text-cyanGlow text-sm"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Ruang chat disesuaikan batas bawahnya agar tidak tertutup elemen input -->
    <main class="absolute top-[70px] bottom-[170px] w-full px-4 overflow-y-auto" id="chat-window">
        <div class="max-w-2xl mx-auto flex flex-col gap-4 mt-4 pb-4">
            <div class="text-center my-2">
                <span class="text-[10px] bg-obsidian/80 text-gray-400 px-3 py-1 rounded-full border border-gray-800">Secure Terminal Session</span>
            </div>
            <div class="flex items-end gap-2 w-5/6 md:w-3/4">
                <div class="msg-bot p-3.5 text-sm shadow-lg text-gray-200 leading-relaxed">
                    👋 Welcome! How can I assist you with your game terminal synchronization today?
                </div>
            </div>
        </div>
    </main>

    <!-- Tombol pilihan cepat (chips) dinaikkan posisinya -->
    <div class="fixed bottom-[125px] w-full px-4 z-40 overflow-x-auto whitespace-nowrap scrollbar-none">
        <div class="max-w-2xl mx-auto flex gap-2">
            <button onclick="sendQuickReply('How to inject credits?')" class="chip px-3 py-1.5 rounded-full text-xs text-cyanGlow font-medium inline-flex items-center gap-1">
                <i class="fas fa-bolt"></i> How to inject credits?
            </button>
            <button onclick="sendQuickReply('What is the locker verification?')" class="chip px-3 py-1.5 rounded-full text-xs text-cyanGlow font-medium inline-flex items-center gap-1">
                <i class="fas fa-shield-alt"></i> Verification & Locker?
            </button>
            <button onclick="sendQuickReply('How does redirect work?')" class="chip px-3 py-1.5 rounded-full text-xs text-cyanGlow font-medium inline-flex items-center gap-1">
                <i class="fas fa-random"></i> How does redirect work?
            </button>
        </div>
    </div>

    <!-- Kotak input chat ditempatkan persis di atas navbar bawah -->
    <div class="fixed bottom-[65px] w-full px-4 py-2 bg-obsidian/95 border-t border-cyanGlow/30 backdrop-blur z-40">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="chat-input" class="flex-grow bg-black/60 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:border-cyanGlow focus:outline-none" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()" class="bg-gradient-to-r from-cyanGlow to-blue-500 px-4 rounded-xl text-obsidian font-black shadow-[0_0_15px_rgba(0,243,255,0.4)] hover:scale-105 transition-transform">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full z-50 glass-panel !rounded-none border-b-0 border-x-0 px-2 py-1.5 pb-2 bg-obsidian/95 backdrop-blur">
        <div class="flex justify-between items-center max-w-md mx-auto relative">
            <a href="index.html" class="flex flex-col items-center p-1.5 text-gray-400 hover:text-white"><i class="fas fa-home text-lg mb-0.5"></i><span class="text-[9px]">Home</span></a>
            <a href="index.html#games" class="flex flex-col items-center p-1.5 text-gray-400 hover:text-white"><i class="fas fa-dice text-lg mb-0.5"></i><span class="text-[9px]">Games</span></a>
            
            <a href="transaction.html" class="relative -top-5 flex flex-col items-center group">
                <div class="w-14 h-14 rounded-full nav-center p-1 flex items-center justify-center group-hover:scale-105 transition-transform">
                    <div class="w-full h-full rounded-full bg-obsidian flex items-center justify-center border-2 border-cyanGlow">
                        <i class="fas fa-wallet text-cyanGlow text-base"></i>
                    </div>
                </div>
            </a>
            
            <a href="chat.html" class="flex flex-col items-center p-1.5 text-cyanGlow"><i class="fas fa-comment-dots text-lg mb-0.5"></i><span class="text-[9px]">Live Chat</span></a>
            <a href="account.html" class="flex flex-col items-center p-1.5 text-gray-400 hover:text-white"><i class="fas fa-user text-lg mb-0.5"></i><span class="text-[9px]">Account</span></a>
        </div>
    </nav>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const inputField = document.getElementById('chat-input');
        
        function appendMsg(text, isUser) {
            const container = chatWindow.querySelector('.max-w-2xl');
            const div = document.createElement('div');
            div.className = isUser ? 'flex items-end w-5/6 md:w-3/4 self-end justify-end ml-auto' : 'flex items-end w-5/6 md:w-3/4';
            div.innerHTML = `<div class="${isUser?'msg-user':'msg-bot'} p-3.5 text-sm text-white leading-relaxed">${text}</div>`;
            container.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showTyping() {
            const container = chatWindow.querySelector('.max-w-2xl');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex items-end w-24';
            typingDiv.innerHTML = `
                <div class="msg-bot p-3 flex items-center gap-1.5">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            container.appendChild(typingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeTyping() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) typingDiv.remove();
        }

        function getBotResponse(input) {
            const text = input.toLowerCase();
            
            if(text.match(/(hi|hello|halo|hey|pagi|siang|malam)/)) {
                return "Hello! How can I help you navigate the Freeplay terminal today?";
            }
            if(text.match(/(inject|credits|bonus|generate|saldo)/)) {
                return "To sync credits, simply select your game from the <a href='index.html#games' class='text-cyanGlow font-bold underline'>Home page</a>, choose your package in the terminal, and execute the synchronization script.";
            }
            if(text.match(/(locker|verify|verification|survey)/)) {
                return "The human verification locker ensures automated bots don't flood the system. Once you open the verification step, you will be presented with a quick offer to complete.";
            }
            if(text.match(/(redirect|url|forward|otomatis)/)) {
                return "Yes! The system features an automatic redirect. Once you successfully complete the verification offer inside the locker, you are instantly redirected to the secure destination page.";
            }
            
            return "You can easily select any game terminal on the <a href='index.html#games' class='text-cyanGlow font-bold underline'>Home page</a> to initiate your session package.";
        }

        function sendQuickReply(text) {
            appendPosMsg = text;
            appendMsg(text, true);
            showTyping();
            setTimeout(() => {
                removeTyping();
                appendMsg(getBotResponse(text), false);
            }, 1200);
        }

        function sendMessage() {
            const val = inputField.value.trim();
            if(!val) return;
            appendMsg(val, true);
            inputField.value = '';
            
            showTyping();
            setTimeout(() => {
                removeTyping();
                appendMsg(getBotResponse(val), false);
            }, 1400);
        }
    </script>
</body>
</html>
