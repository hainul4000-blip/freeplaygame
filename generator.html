<body class="pb-24">

    <script>
        let selectedAmount = 0;
        
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'account.html';
                return;
            }
            const game = new URLSearchParams(window.location.search).get('game') || 'Unknown Target';
            document.getElementById('display-name').innerText = game;
            document.getElementById('username').value = localStorage.getItem('username');
        });

        function startInjection() {
            selectedAmount = parseFloat(document.getElementById('bonus-amount').value);
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('terminal-section').classList.remove('hidden');
            runTerminal();
        }

        async function runTerminal() {
            const out = document.getElementById('console-output');
            const pBar = document.getElementById('progress-bar');
            const pText = document.getElementById('progress-percent');
            const game = document.getElementById('display-name').innerText;
            const uname = document.getElementById('username').value;
            
            const logs = [
                `> TARGET ACQUIRED: ${game.toUpperCase()}`,
                `> VALIDATING SESSION: ${uname}`,
                `> BYPASSING ENCRYPTION LAYERS...`,
                `> INJECTING $${selectedAmount.toFixed(2)} CREDITS...`,
                `> WRITING TO BLOCKCHAIN LEDGER...`,
                `> WARNING: SECURITY NODE TRIPPED.`
            ];

            const update = (val) => { pBar.style.width = val+'%'; pText.innerText = val+'%'; }

            for(let i=0; i<logs.length; i++) {
                await new Promise(r => setTimeout(r, 700));
                out.innerHTML += `<div>${logs[i]}</div>`;
                out.parentElement.scrollTop = out.parentElement.scrollHeight;
                update(Math.min((i+1)*15, 80));
            }

            await new Promise(r => setTimeout(r, 1500));
            out.innerHTML += `<div class="text-goldVip mt-2">> SYSTEM HALTED PENDING HUMAN VERIFICATION.</div>`;
            update(100);
            
            document.getElementById('final-cta').classList.remove('hidden');
        }

        function triggerLocker() {
            let currentBal = parseFloat(localStorage.getItem('balance')) || 0;
            localStorage.setItem('balance', (currentBal + selectedAmount).toFixed(2));
            localStorage.setItem('generatorCompleted', 'true');
            
            if (typeof _kt === 'function') { _kt(); } else { alert("Loading Verification..."); }
        }
    </script>
