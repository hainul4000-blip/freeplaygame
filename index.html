<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freeplay - Official VIP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { obsidian: '#07080d', cyanGlow: '#00f3ff', goldVip: '#ffd700' } } }
        }
    </script>
    <style>
        body { background-color: #07080d; color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .gaming-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #07080d; overflow: hidden; }
        .grid-overlay { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px); background-size: 50px 50px; animation: gridMove 25s linear infinite; }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }
        .glass-panel { background: rgba(5, 42, 51, 0.3); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 12px; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; font-weight: bold; border: 1px solid #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); transition: all 0.3s; }
        .btn-gold:hover { transform: translateY(-2px); }
        .card-hover:hover { transform: translateY(-5px); border-color: #00f3ff; box-shadow: 0 10px 25px rgba(0, 243, 255, 0.2); }
        .nav-center { background: linear-gradient(135deg, #00f3ff, #0088ff); box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); animation: pulseNav 2s infinite; }
        @keyframes pulseNav { 0%, 100% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); } 50% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); } }
    </style>
</head>
<body class="pb-24">
    <div class="gaming-bg"><div class="grid-overlay"></div></div>

    <header class="fixed top-0 w-full z-50 glass-panel !rounded-none border-t-0 border-x-0 px-4 py-3 flex justify-between items-center bg-obsidian/90">
        <img src="https://i.postimg.cc/yYcG9Y7Q/logo-header.png" alt="Freeplay Logo" class="h-8 object-contain">
        <div class="px-3 py-1 bg-goldVip text-black rounded-full text-xs font-bold uppercase tracking-wider shadow-[0_0_10px_rgba(255,215,0,0.5)]">
            <i class="fas fa-crown"></i> VIP Portal
        </div>
    </header>

    <main class="pt-24 px-4 max-w-5xl mx-auto relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyanGlow to-white drop-shadow-[0_0_10px_rgba(0,243,255,0.7)]">Official US Sweepstakes</h1>
            <p class="text-gray-400 text-sm">Select your favorite game to inject credits securely.</p>
        </div>

        <div class="mb-8 flex justify-center">
            <div id="notification-bar" class="glass-panel px-6 py-3 rounded-full flex items-center gap-3 text-sm text-cyanGlow shadow-[0_0_15px_rgba(0,243,255,0.2)] transition-opacity duration-500">
                <i class="fas fa-broadcast-tower animate-pulse"></i>
                <span id="notification-text">System Online. Connecting...</span>
            </div>
        </div>

        <h2 id="games" class="text-xl font-bold mb-4 border-l-4 border-cyanGlow pl-3">Featured Games</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="game-grid"></div>
    </main>

    <nav class="fixed bottom-0 w-full z-50 glass-panel !rounded-none border-b-0 border-x-0 px-2 py-2 pb-4 bg-obsidian/95">
        <div class="flex justify-between items-center max-w-md mx-auto relative">
            <a href="index.html" class="flex flex-col items-center p-2 text-cyanGlow"><i class="fas fa-home text-xl mb-1"></i><span class="text-[10px]">Home</span></a>
            <a href="index.html#games" class="flex flex-col items-center p-2 text-gray-400 hover:text-white transition-colors"><i class="fas fa-dice text-xl mb-1"></i><span class="text-[10px]">Games</span></a>
            <a href="transaction.html" class="relative -top-6 flex flex-col items-center">
                <div class="w-16 h-16 rounded-full nav-center p-1 flex items-center justify-center">
                    <img src="https://i.postimg.cc/fTmPXTMB/logo-fp.png" alt="FP" class="w-full h-full rounded-full border-2 border-obsidian bg-obsidian">
                </div>
            </a>
            <a href="chat.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-white transition-colors"><i class="fas fa-comment-dots text-xl mb-1"></i><span class="text-[10px]">Live Chat</span></a>
            <a href="account.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-white transition-colors"><i class="fas fa-user text-xl mb-1"></i><span class="text-[10px]">Account</span></a>
        </div>
    </nav>

    <script>
        const games = [
            { name: 'Cash Machine', img: 'https://i.postimg.cc/J4ZFJ41w/cash-machine.png' },
            { name: 'Casino Night', img: 'https://i.postimg.cc/BQHzDQqf/casino-night.png' },
            { name: 'Fire Kirin', img: 'https://i.postimg.cc/P5HRMsq6/fire-kirin.png' },
            { name: 'Game Vault', img: 'https://i.postimg.cc/K8bH5SYp/game-vault.png' },
            { name: 'Gameroom', img: 'https://i.postimg.cc/htn50WGy/gameroom.png' },
            { name: 'Golden Dragon', img: 'https://i.postimg.cc/pLv6BbdS/golden-dragon.png' },
            { name: 'Juwa 777', img: 'https://i.postimg.cc/65nPR5Bb/juwa-777.png' },
            { name: 'Milky Ways', img: 'https://i.postimg.cc/MKVLRKzr/milky-ways.png' },
            { name: 'Orion Stars', img: 'https://i.postimg.cc/tCWcPC9M/orion-stars.png' },
            { name: 'Panda Master', img: 'https://i.postimg.cc/VLnhMLz2/panda-master.png' },
            { name: 'Ultra Monster', img: 'https://i.postimg.cc/3JmqpJ3P/ultra-monster.png' },
            { name: 'Vblink', img: 'https://i.postimg.cc/CLk2DLw3/vblink.png' }
        ];

        const grid = document.getElementById('game-grid');
        games.forEach(game => {
            grid.innerHTML += `
                <div onclick="selectGame('${game.name}')" class="glass-panel overflow-hidden card-hover relative group flex flex-col cursor-pointer border border-gray-700 bg-obsidian">
                    <div class="absolute top-2 right-2 bg-goldVip text-black text-[10px] font-bold px-2 py-1 rounded z-10 animate-pulse">BONUS READY</div>
                    <div class="h-32 w-full p-2 flex items-center justify-center border-b border-gray-800">
                        <img src="${game.img}" alt="${game.name}" class="max-h-full max-w-full object-contain group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="p-3 text-center flex-grow flex flex-col justify-between">
                        <h3 class="font-bold text-sm mb-2 text-white">${game.name}</h3>
                        <button class="w-full py-1.5 rounded btn-gold text-xs">PLAY GAME</button>
                    </div>
                </div>
            `;
        });

        // ALUR: Cek Login
        function selectGame(gameName) {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'account.html';
            } else {
                window.location.href = `generator.html?game=${encodeURIComponent(gameName)}`;
            }
        }

        const notifications = [
            "User Jas*** just cashed out $1,250!", "User Mik*** completed VIP verification.", "System: Secure servers online.", "User ***77 successfully injected $500.", "User VIP*** withdrew $3,400 via USDT."
        ];
        let notifIndex = 0;
        const notifBar = document.getElementById('notification-bar');
        setInterval(() => {
            notifBar.style.opacity = '0';
            setTimeout(() => {
                notifIndex = (notifIndex + 1) % notifications.length;
                document.getElementById('notification-text').innerText = notifications[notifIndex];
                notifBar.style.opacity = '1';
            }, 500);
        }, 4000);
    </script>
</body>
</html>
